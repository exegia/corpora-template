name: Bug report
description: Something is broken or behaves unexpectedly
title: "bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include secrets or credentials.
        For security vulnerabilities, use private vulnerability reporting instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or commands to trigger the problem.
      placeholder: |
        1. Run `make ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: stack
    attributes:
      label: Stack
      description: Which part of the project is affected?
      options:
        - Rust / GPUI
        - Python
        - TypeScript
        - React
        - Expo
        - SwiftUI
        - AI agents
        - CI / automation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag (e.g. v1.2.3) or commit SHA.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11, ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Redact tokens, keys, and personal data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and credentials from logs and attachments.
          required: true
