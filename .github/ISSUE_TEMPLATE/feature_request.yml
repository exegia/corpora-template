name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: stack
    attributes:
      label: Stack
      options:
        - Rust / GPUI
        - Python
        - TypeScript
        - React
        - Expo
        - SwiftUI
        - AI agents
        - CI / automation
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      description: Breaking changes trigger a major version bump.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
