# Release tagging — conventional-commit semver bump on next → main merge.
#
# When the next PR is merged into main (production), compute the next semantic version from
# the conventional-commit subjects since the last tag:
#   - BREAKING CHANGE (or `type!:`) → major
#   - feat:                          → minor
#   - fix:                           → patch
#   - anything else                  → patch
# Then create the vX.Y.Z tag on the merge commit, create a GitHub Release, and — if CHANGELOG.md
# has a `## [Unreleased]` heading — rename it to `## [vX.Y.Z] - YYYY-MM-DD` so the changelog
# matches the tag.
#
# Plain .yml: deterministic version math, no reasoning.
name: Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # push tag, push CHANGELOG commit, create release
  pull-requests: read

jobs:
  tag:
    # Only merged next → main PRs.
    if: github.event.pull_request.merged == true && github.head_ref == 'next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next version, tag, release, and stamp CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          # Latest existing tag (vX.Y.Z), or v0.0.0 if none.
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          base=${latest#v}
          IFS=. read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          # Commit subjects + bodies since the last tag up to the merge commit.
          range="${latest}..${MERGE_SHA}"
          subjects=$(git log --pretty=%s "${range}" 2>/dev/null || true)
          bodies=$(git log --pretty=%b "${range}" 2>/dev/null || true)

          # Determine bump level from conventional commits.
          bump="patch"
          if printf '%s\n%s\n' "$subjects" "$bodies" | grep -qiE 'BREAKING[[:space:]]+CHANGE'; then
            bump="major"
          elif printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            bump="major"
          elif printf '%s\n' "$subjects" | grep -qiE '^(feat|feature)(\(|:|!)'; then
            bump="minor"
          elif printf '%s\n' "$subjects" | grep -qiE '^fix(\(|:|!)'; then
            bump="patch"
          fi

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          today=$(date -u +%Y-%m-%d)
          echo "Bump: $bump  →  $latest → $new_tag  (merge $MERGE_SHA)"

          # Stamp CHANGELOG.md: rename `## [Unreleased]` → `## [${new_tag}] - ${today}`.
          if [ -f CHANGELOG.md ] && grep -qE '^##[[:space:]]*\[Unreleased\]' CHANGELOG.md; then
            sed -i -E "0,/^##[[:space:]]*\[Unreleased\]/s|^##[[:space:]]*\[Unreleased\].*|## [${new_tag}] - ${today}|" CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): stamp ${new_tag} in CHANGELOG" || true
          fi

          # Ensure the tag lands on the merge commit (after any CHANGELOG commit, fast-forward
          # main is fine; the tag points at the merge SHA so the release is anchored to the PR).
          git tag -a "$new_tag" -m "Release $new_tag (PR #$PR_NUMBER)" "$MERGE_SHA"
          git push origin main --tags

          # GitHub Release with auto-generated notes.
          notes=$(printf '%s\n' \
            "Release ${new_tag} — promoted from ${MERGE_SHA:0:7} via PR #${PR_NUMBER}." \
            "" \
            "Conventional-commit bump: **${bump}** (${latest} → ${new_tag})." \
            "" \
            "PR: ${PR_URL}")
          gh release create "$new_tag" \
            --target main \
            --title "$new_tag" \
            --notes "$notes" --generate-notes

          echo "✓ Tagged $new_tag and created release."
