name: Matrix

# Wider coverage than the PR gate: every OS the stacks care about, plus the e2e suite.
# Runs after merges to next / release branches, nightly on the default branch, and on demand.

on:
  push:
    branches:
      - next
      - "release/v*"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_SCHEME: ${{ vars.XCODE_SCHEME }}
  XCODE_DESTINATION: ${{ vars.XCODE_DESTINATION }}
  XCODE_UITEST_TARGET: ${{ vars.XCODE_UITEST_TARGET }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: runners
        env:
          MATRIX_RUNNERS: ${{ vars.MATRIX_RUNNERS }}
        run: echo "runners=$(scripts/stack.sh matrix-runners)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: detect
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: make ci

  e2e:
    name: e2e (${{ matrix.os }})
    needs: detect
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make e2e
      - name: Upload e2e reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
