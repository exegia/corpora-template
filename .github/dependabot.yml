# Generated by scripts/sync-dependabot.sh from the detected stacks. Re-run
# `make dependabot` after adding a stack; hand edits are overwritten.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      devcontainers-minor-and-patch:
        update-types: ["minor", "patch"]
